server:
    servlet:
        context-path: /api/v1

spring: 
    datasource: 
        url: ${DB_URL:jdbc:postgresql://localhost:5432/learninghub}
        username: ${DB_USERNAME:postgres}
        password: ${DB_PASSWORD:postgres}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                format-sql: true
    flyway:
        enabled: true
        locations: classpath:db/migration/postgresql
    servlet:
        multipart:
            enabled: true
            max-file-size: 10MB
            max-request-size: 10MB
    mail:
        host: smtp-relay.brevo.com
        port: 587
        username: ${MAIL_USERNAME}
        password: ${MAIL_PASSWORD}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true

jwt: 
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: ${JWT_EXPIRATION:86400000}

app:
    attendance:
        max-absent-ratio: ${ATTENDANCE_MAX_ABSENT_RATIO:0.2}
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    upload:
        max-video-size: 200MB
    academic:
        pass-score: 5.0
        warning-gpa: 2.0
        probation-gpa: 1.5
    registration:
        # Trần tín chỉ áp dụng cho sinh viên đang bị cảnh báo học vụ (warningLevel >= 2).
        # Trần mặc định của RegistrationPeriod vẫn được ưu tiên nếu nhỏ hơn giá trị này.
        max-credits-probation: ${REG_MAX_CREDITS_PROBATION:14}
    curriculum:
        pass-score: 5.0

cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
