server:
    servlet:
        context-path: /api/v1

spring: 
    datasource: 
        url: ${DB_URL:jdbc:mysql://localhost:3306/learninghub?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:123456}
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                format-sql: true
    flyway:
        enabled: true
        baseline-on-migrate: true
    servlet:
        multipart:
            enabled: true
            max-file-size: 10MB
            max-request-size: 10MB
    mail:
        host: smtp-relay.brevo.com
        port: 587
        username: ${MAIL_USERNAME}
        password: ${MAIL_PASSWORD}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true

jwt: 
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: ${JWT_EXPIRATION:86400000}

app:
    attendance:
        max-absent-ratio: ${ATTENDANCE_MAX_ABSENT_RATIO:0.2}
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    upload:
        max-video-size: 200MB

cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
