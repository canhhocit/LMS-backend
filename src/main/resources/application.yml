spring:
  jmx:
    enabled: false
  application:
    admin:
      enabled: false
  jackson:
    serialization:
      fail-on-empty-beans: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
  profiles:
    active: ${SPRING_PROFILE:dev}
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format-sql: true
  flyway:
    enabled: false
    locations: classpath:db/migration/postgresql
  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      max-request-size: 200MB
  mail:
    host: ${SMTP_HOST:smtp-relay.brevo.com}
    port: ${SMTP_PORT:587}
    username: ${MAIL_USERNAME:${SMTP_USERNAME:}}
    password: ${MAIL_PASSWORD:${SMTP_PASSWORD:}}
    from: ${MAIL_FROM:${SMTP_USERNAME:canhhuu205@gmail.com}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: "*"

  ai:
    openai:
      api-key: ${AI_API_KEY:${AI_APIKEY:${GEMINI_API_KEY:mock-key-for-spring-ai}}}
      base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}
      chat:
        options:
          model: ${AI_MODEL:gemini-1.5-flash}

server:
  servlet:
    context-path: /api/v1

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  attendance:
    max-absent-ratio: ${ATTENDANCE_MAX_ABSENT_RATIO:0.2}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  upload:
    max-video-size: 500MB
  academic:
    pass-score: 5.0
    warning-gpa: 2.0
    probation-gpa: 1.5
  registration:
    max-credits-probation: ${REG_MAX_CREDITS_PROBATION:14}
  curriculum:
    pass-score: 5.0
  ai:
    api-key: ${AI_API_KEY:${AI_APIKEY:${GEMINI_API_KEY:}}}
    base-url: ${AI_BASE_URL:${AI_BASEURL:${AI_URL:https://generativelanguage.googleapis.com/v1beta/models}}}
    model: ${AI_MODEL:gemini-1.5-flash}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

payos:
  client-id: ${PAYOS_CLIENT_ID:demo-client-id}
  api-key: ${PAYOS_API_KEY:demo-api-key}
  checksum-key: ${PAYOS_CHECKSUM_KEY:demo-checksum-key}

google:
  drive:
    folder-id: ${GOOGLE_DRIVE_FOLDER_ID:}
    client-id: ${GOOGLE_DRIVE_CLIENT_ID:}
    client-secret: ${GOOGLE_DRIVE_CLIENT_SECRET:}
    refresh-token: ${GOOGLE_DRIVE_REFRESH_TOKEN:}

resilience4j:
  retry:
    instances:
      aiClient:
        max-attempts: 3
        wait-duration: 1000ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2





